[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycrefine"
version = "0.1.0"
description = "A Python .pyc decompiler with version-aware architecture"
authors = [{name = "Saheb", email = "your-email@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [] # Keeps your "no dependencies" promise

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pycrefine = "pycrefine:main" # Allows running 'pycrefine' directly in terminal

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"