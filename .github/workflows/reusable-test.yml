name: Reusable Pytest
on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[test]"
    - name: Test with pytest
      run: pytest
    - name: Correctness gate
      if: success() || failure()
      run: python quality/check_correctness.py --coherency --report correctness-report.json
    - name: Upload correctness report
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: correctness-report-py${{ inputs.python-version }}
        path: correctness-report.json
        if-no-files-found: ignore
